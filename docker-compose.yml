services:
  postgres:
    image: postgres:16-alpine
    container_name: havenpet-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: havenpet
      POSTGRES_PASSWORD: havenpet_secret
      POSTGRES_DB: havenpet_scm
    volumes:
      - havenpet_pgdata:/var/lib/postgresql/data

volumes:
  havenpet_pgdata:
